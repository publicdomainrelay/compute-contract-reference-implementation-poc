<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.purple.min.css">
  <style>
    :root {
      --graph-bg: #ffffff;
    }
    body { margin: 0; padding: 0; }
    main.container { max-width: 100%; padding: 0.5rem 1rem; }

    /* top bar */
    #topbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--pico-muted-border-color);
    }
    #topbar h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; }
    #status { font-size: 0.8rem; color: var(--pico-muted-color); min-width: 12rem; }
    #status.connected { color: var(--pico-color-green-400); }
    #status.disconnected { color: var(--pico-color-red-400); }
    #nsid-filters { display: flex; gap: 0.25rem; flex-wrap: wrap; }
    #nsid-filters label { font-size: 0.7rem; cursor: pointer; user-select: none;
      padding: 0.15rem 0.4rem; border-radius: 4px;
      border: 1px solid var(--pico-muted-border-color);
      background: var(--pico-code-background-color);
    }
    #nsid-filters label.off { opacity: 0.35; }
    #nsid-filters input { display: none; }

    /* graph + detail split */
    #main-area {
      display: flex;
      height: calc(100vh - 4rem);
    }
    #graph-pane {
      flex: 1;
      min-width: 0;
      background: var(--graph-bg);
      position: relative;
    }
    #graph-pane svg { width: 100%; height: 100%; display: block; }

    /* detail panel */
    #detail-pane {
      width: 380px;
      max-width: 45vw;
      border-left: 1px solid var(--pico-muted-border-color);
      overflow-y: auto;
      padding: 1rem;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #detail-empty { color: var(--pico-muted-color); font-style: italic; }
    #detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    #detail-header code { word-break: break-all; font-size: 0.75rem; }
    #detail-yaml {
      background: var(--pico-code-background-color);
      color: var(--pico-code-color);
      font-family: monospace;
      font-size: 0.75rem;
      padding: 0.75rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 55vh;
      overflow-y: auto;
      border-radius: 4px;
      line-height: 1.4;
    }
    #detail-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    #detail-actions button { font-size: 0.75rem; padding: 0.25rem 0.5rem; }

    /* legend */
    #legend {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--pico-muted-border-color);
      border-radius: 6px;
      padding: 0.5rem;
      font-size: 0.65rem;
      color: #333;
      max-height: 50vh;
      overflow-y: auto;
      z-index: 10;
    }
    #legend table { margin: 0; }
    #legend td { padding: 1px 4px; }
    #legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }

    /* responsive: stack detail below on narrow screens */
    @media (max-width: 720px) {
      #main-area { flex-direction: column; }
      #detail-pane { width: 100%; max-width: 100%; max-height: 40vh; border-left: none; border-top: 1px solid var(--pico-muted-border-color); }
    }

    /* node labels */
    .node-label { fill: #333; font-size: 9px; pointer-events: none; text-anchor: middle; }
    .edge-label { fill: #666; font-size: 7px; text-anchor: middle; }

    /* recording controls */
    #rec-indicator { font-size: 0.75rem; color: #d00; animation: rec-blink 1s step-end infinite; }
    @keyframes rec-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    #rec-button.recording { color: var(--pico-color-red-400); border-color: var(--pico-color-red-400); }
  </style>
  <title>Market Graph Viewer</title>
  <script type="importmap">
  {
    "imports": {
      "d3": "https://esm.sh/d3@7.9.0"
    }
  }
  </script>
</head>
<body>
  <header id="topbar">
    <h1>🧮 Market Graph</h1>
    <span id="status" class="disconnected">● disconnected</span>
    <span style="font-size:0.7rem;color:var(--pico-muted-color);">
      <span id="node-count">0</span> nodes ·
      <span id="edge-count">0</span> edges
    </span>
    <div id="nsid-filters"></div>
    <button id="clear-button" class="secondary outline" style="font-size:0.75rem;padding:0.2rem 0.5rem;">Clear</button>
    <button id="pause-button" class="secondary outline" style="font-size:0.75rem;padding:0.2rem 0.5rem;">Pause</button>
    <span id="rec-indicator" style="display:none;">⏺ REC</span>
    <button id="rec-button" class="secondary outline" style="font-size:0.75rem;padding:0.2rem 0.5rem;">⏺ Record</button>
    <select id="session-select" style="font-size:0.75rem;padding:0.2rem 0.3rem;max-width:220px;">
      <option value="">— saved sessions —</option>
    </select>
    <button id="session-load-button" class="secondary outline" style="font-size:0.75rem;padding:0.2rem 0.5rem;" disabled>Load</button>
    <button id="session-download-button" class="secondary outline" style="font-size:0.75rem;padding:0.2rem 0.5rem;" disabled title="Download selected recording">⬇</button>
    <button id="session-import-button" class="secondary outline" style="font-size:0.75rem;padding:0.2rem 0.5rem;" title="Import recording from file">📂</button>
    <input type="file" id="import-file-input" accept=".json" style="display:none;">
  </header>

  <div id="main-area">
    <div id="graph-pane">
      <svg></svg>
      <div id="legend"></div>
    </div>
    <aside id="detail-pane">
      <div id="detail-empty">Hover a node to inspect. Click to open on pdsls.dev.</div>
      <div id="detail-header" style="display:none;">
        <div>
          <strong id="detail-title"></strong>
          <br><code id="detail-uri"></code>
          <br><small id="detail-meta"></small>
        </div>
      </div>
      <div id="detail-yaml" style="display:none;"></div>
      <div id="detail-actions" style="display:none;">
        <button id="detail-pdsls-link" class="secondary">Open on pdsls.dev ↗</button>
        <button id="detail-pin-button" class="secondary outline">Pin node</button>
      </div>
    </aside>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
