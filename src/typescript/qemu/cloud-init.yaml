#cloud-config
users:
  - name: agent
    gecos: Policy Engine Agent
    primary_group: agent
    groups:
      - users
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    no_user_group: false

write_files:
  - path: /etc/systemd/system/fedproxy-client.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=FedProxy Client Service
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/root
      Environment="SERVICE=policy-engine-a760684121f92cf5"
      Environment="PORT=8080"
      Environment="ATPRP_URL=https://rp.fedproxy.com"
      Environment="AUTH_PLUGIN=oidc"
      Environment="MARKET_ACCEPT_JSON_PATH=/root/secrets/publicdomainrelay.com/market/accept.json"
      ExecStart=/usr/local/bin/fedproxy-client
      Restart=always
      RestartSec=5
      TimeoutStopSec=10
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/policy-engine.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Policy Engine Service
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=agent
      Group=agent
      WorkingDirectory=/home/agent
      Environment="BUNDLED_ACTIONS_DIR=/home/agent/bundled-actions"
      ExecStart=/usr/local/bin/policy_engine --log-level trace api --bind 127.0.0.1:8080
      Restart=always
      RestartSec=5
      TimeoutStopSec=10
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/wait-for-health
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -x
      set -euo pipefail
      URL="$1/health"
      ENDPOINT="$1"
      MAX_ATTEMPTS=30
      ATTEMPT=0
      WAIT_SECS=0.1

      tee /home/agent/workflow.yml <<'EOF'
      name: 'build: containers'

      on:
        push:
          branches:
            - main

      jobs:
        check:
          runs-on: ubuntu-latest
          steps:
            - name: checkout
              # uses: actions/checkout@v4
              run: |
                set -x
                set +e
                git clone https://github.com/publicdomainrelay/compute-contract-reference-implementation-poc

            - name: Print all files
              run: |
                echo "=== WORKSPACE ==="
                find .
                echo "=== DONE ==="

            - name: Build qemu runner container
              run: |
                set -x
                set +e
                export DEBIAN_FRONTEND=noninteractive
                which findmnt
                sudo apt-get update
                sudo apt-get install -y util-linux
                which findmnt

                sudo findmnt /var/lib/docker
                sudo findmnt /var/lib/containerd

                cd compute-contract-reference-implementation-poc
                cd src/typescript/qemu/
                # --push
                sudo docker build --pull --progress plain -f qemu-runner.Dockerfile -t atcr.io/johnandersen777.bsky.social/ccripoc-qemu-runner .
      EOF

      while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
        if curl -sf "$URL" | grep -q '"status":"ok"'; then
          echo "Health check passed"

          cat /home/agent/workflow.yml

          # FIXED: Changed from my_workflow.yml to workflow.yml to match the write_files destination
          TASK_ID=$(/usr/local/bin/policy_engine client -e "$ENDPOINT" create \
            -w /home/agent/workflow.yml -R myorg/myrepo \
            -i key=value \
            | jq -r '.detail.id')

          # Stream console output in real time (follows until done)
          /usr/local/bin/policy_engine client -e "$ENDPOINT" output \
            -t "$TASK_ID" --follow

          # Check the final status (poll until complete)
          /usr/local/bin/policy_engine client -e "$ENDPOINT" status \
            -t "$TASK_ID" --wait

          # Or get the status as YAML
          /usr/local/bin/policy_engine client -e "$ENDPOINT" status \
            -t "$TASK_ID" --wait --output-format yaml | tee /home/agent/workflow-status.yaml

          exit 0
        fi
        ATTEMPT=$((ATTEMPT + 1))
        echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS failed, retrying..."
        sleep $WAIT_SECS
      done

      echo "Health check failed after $MAX_ATTEMPTS attempts"
      exit 1

