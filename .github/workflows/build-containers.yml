name: 'build: containers'

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: find workspace
        run: |
          echo "=== WORKSPACE ==="
          find .
          echo "=== DONE ==="

      - name: build qemu runner
        run: |
          cd src/typescript/qemu/
          # --push
          docker build --pull --progress plain -f Dockerfile -t atcr.io/johnandersen777.bsky.social/ccripoc-qemu-runner .
